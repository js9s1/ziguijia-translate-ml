<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理结果 - 宁的视频翻译工具</title>
    <link rel="stylesheet" href="/ning.css">
    <style>
        .file-list { list-style: none; padding: 0; }
        .file-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .file-list li:last-child { border-bottom: none; }
        .file-info { display: flex; align-items: center; gap: 10px; }
        .file-name { font-weight: 500; }
        .file-size { color: #666; font-size: 0.85em; }
        .file-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            min-width: 280px;
            align-items: center;
        }
        .file-actions a,
        .file-actions button {
            box-sizing: border-box;
            width: 100%;
            text-align: center;
            line-height: 1.4;
        }
        .file-actions.editable {
            grid-template-columns: repeat(4, 1fr);
        }
        .btn-download {
            padding: 5px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
        }
        .btn-download:hover { background: #45a049; }
        .btn-delete {
            padding: 5px 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-delete:hover { background: #da190b; }
        .btn-placeholder {
            visibility: hidden;
            padding: 5px 15px;
            font-size: 0.9em;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }
        .status-pending { background: #ffc107; color: #000; }
        .status-processing { background: #2196F3; color: #fff; }
        .status-completed { background: #4CAF50; color: #fff; }
        .status-failed { background: #f44336; color: #fff; }
        .status-cancelled { background: #9e9e9e; color: #fff; }
        .no-files { color: #999; text-align: center; padding: 20px; }
        .job-info { background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .job-info p { margin: 5px 0; }
        .btn-play {
            padding: 5px 15px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-play:hover { background: #1976D2; }
        .btn-resubmit {
            width: 100px;
            padding: 1px 0;
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.65em;
            margin-left: 4px;
            vertical-align: middle;
            text-align: center;
        }
        .btn-resubmit:hover { background: #F57C00; }
        .btn-edit {
            padding: 5px 15px;
            background: #9C27B0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-edit:hover { background: #7B1FA2; }
        .btn-edit.resubmit {
            background: #FF9800;
        }
        .btn-edit.resubmit:hover { background: #F57C00; }
        .file-audio { margin-top: 8px; width: 100%; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }
        .modal-content video { max-width: 90vw; max-height: 85vh; border-radius: 8px; }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }
        /* ── SRT Editor modal ── */
        .editor-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .editor-overlay.active { display: flex; }
        .editor-modal {
            background: #1e1e1e;
            border-radius: 8px;
            width: 90vw;
            height: 85vh;
            display: flex;
            flex-direction: column;
            color: #ccc;
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .editor-header h3 {
            margin: 0;
            color: #fff;
            font-size: 1.1em;
        }
        .editor-actions {
            display: flex;
            gap: 8px;
        }
        .editor-actions button {
            padding: 6px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-editor-save {
            background: #4CAF50;
            color: white;
        }
        .btn-editor-save:hover { background: #45a049; }
        .btn-editor-cancel {
            background: #666;
            color: white;
        }
        .btn-editor-cancel:hover { background: #555; }
        .editor-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            min-height: 0;
        }
        .editor-body textarea {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #252526;
            color: #d4d4d4;
            tab-size: 4;
            box-sizing: border-box;
        }
        .editor-status {
            padding: 8px 16px;
            font-size: 0.85em;
            border-top: 1px solid #333;
            flex-shrink: 0;
        }
        .editor-status.success { color: #4CAF50; }
        .editor-status.error { color: #f44336; }
        .file-actions.editable {
            grid-template-columns: repeat(4, 1fr);
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">加载中，请稍候...</div>
        </div>
    </div>

    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>

    <div class="container">
        <h1>处理结果</h1>

        <div class="job-info" id="jobInfo">
            <p><strong>访问码:</strong> <span id="accessCode"></span> <span style="margin-left:8px;"><strong>目标语言:</strong> <span id="targetLanguageBadge" style="display:none;" class="status-badge status-completed"></span></span></p>
            <p><strong>状态:</strong> <span id="status" class="status-badge"></span> <span id="progressText" style="margin-left:8px;color:#666;font-size:0.9em;"></span> <button id="resubmitBtn" onclick="resubmitJob()" class="btn-resubmit" style="display:none;">重新提交</button></p>
            <p id="paramsRow" style="display:none;"><strong>参数:</strong> <span id="paramDisplay"></span></p>
            <p><strong>输出目录:</strong> <span id="outputDir"></span></p>
            <p id="errorPara" style="display:none;"><strong>错误:</strong> <span id="errorMsg" class="error"></span></p>
        </div>

        <h2>生成的文件</h2>
        <ul class="file-list" id="fileList">
            <li class="no-files">加载中...</li>
        </ul>

        <div style="margin-top: 20px;">
            <button id="refreshBtn" onclick="refreshFiles()" class="btn-download" style="display:none;">刷新</button>
        </div>

        <!-- <h2>任务日志</h2>
        <div id="jobLogSection" style="margin-top: 10px;">
            <a href="#" id="jobLogLink" class="btn-download" style="display:none;">下载日志</a>
            <pre id="jobLogContent" style="background:#f5f5f5;padding:10px;border-radius:4px;margin-top:10px;max-height:300px;overflow-y:auto;display:none;"></pre>
        </div>
    -->
    </div>

    <div class="modal-overlay" id="videoModal" onclick="closeVideo()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeVideo()">&times;</button>
            <video id="modalVideo" controls autoplay></video>
        </div>
    </div>

    <!-- ── SRT Editor Modal ── -->
    <div class="editor-overlay" id="srtEditorOverlay">
        <div class="editor-modal">
            <div class="editor-header">
                <h3>编辑 SRT 文件: <span id="editorFileName"></span></h3>
                <div class="editor-actions">
                    <button class="btn-editor-cancel" onclick="closeSrtEditor()">取消</button>
                    <button class="btn-editor-save" id="editorSaveBtn" onclick="saveSrtEdit()">保存</button>
                </div>
            </div>
            <div class="editor-body">
                <textarea id="editorTextarea" spellcheck="false"></textarea>
                <div class="editor-status" id="editorStatus"></div>
            </div>
        </div>
    </div>

    <script>
        const accessCode = new URLSearchParams(window.location.search).get('code');

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        const statusLabels = {
            pending: '等待中',
            processing: '处理中',
            completed: '已完成',
            failed: '失败',
            cancelled: '已取消',
        };

        function getStatusClass(status) {
            return 'status-' + (status || 'pending');
        }

        let editedSrtFiles = [];

        // Any .srt file is editable except output_adjusted.srt (the final generated output).
        const isEditableSrt = name => name.toLowerCase().endsWith('.srt') && name !== 'output_adjusted.srt';

        function shortPath(p) {
            if (!p) return 'N/A';
            return p.replace('/home/js9s', '~');
        }

        function loadJobStatus() {
            if (!accessCode) {
                document.getElementById('fileList').innerHTML = '<li class="no-files">无效的访问码</li>';
                return;
            }

            fetch('/srt/status/' + accessCode)
                .then(response => response.json())
                .then(data => {
                    editedSrtFiles = data.edited_srt_files || [];

                    const langMap = { en: '🇬🇧 英文', zh: '🇨🇳 中文', ja: '🇯🇵 日语', ko: '🇰🇷 韩语', fr: '🇫🇷 法语', es: '🇪🇸 西班牙语', ru: '🇷🇺 俄语', ms: '🇲🇾 马来语', ar: '🇸🇦 阿拉伯语', da: '🇩🇰 丹麦语', de: '🇩🇪 德语', el: '🇬🇷 希腊语', fi: '🇫🇮 芬兰语', he: '🇮🇱 希伯来语', hi: '🇮🇳 印地语', it: '🇮🇹 意大利语', nl: '🇳🇱 荷兰语', no: '🇳🇴 挪威语', pl: '🇵🇱 波兰语', pt: '🇵🇹 葡萄牙语', sv: '🇸🇪 瑞典语', sw: '🇹🇿 斯瓦希里语', tr: '🇹🇷 土耳其语', th: '🇹🇭 泰语', id: '🇮🇩 印尼语' };
                    const langEl = document.getElementById('targetLanguageBadge');
                    if (data.target_language && langMap[data.target_language]) {
                        langEl.textContent = langMap[data.target_language];
                        langEl.style.display = 'inline';
                    } else if (data.target_language) {
                        langEl.textContent = '🌐 ' + data.target_language;
                        langEl.style.display = 'inline';
                    } else {
                        langEl.style.display = 'none';
                    }

                    document.getElementById('accessCode').textContent = accessCode;
                    document.getElementById('status').textContent = statusLabels[data.status] || data.status;
                    document.getElementById('status').className = 'status-badge ' + getStatusClass(data.status);

                    const progressEl = document.getElementById('progressText');
                    if (data.progress) {
                        progressEl.textContent = '— ' + shortPath(data.progress);
                        progressEl.style.display = 'inline';
                    } else {
                        progressEl.textContent = '';
                        progressEl.style.display = 'none';
                    }

                    document.getElementById('outputDir').textContent = shortPath(data.output_dir);

                    // ── Display temperature / cfg_weight / exaggeration ──
                    const paramsEl = document.getElementById('paramDisplay');
                    const paramsRow = document.getElementById('paramsRow');
                    const parts = [];
                    if (data.temperature != null) parts.push('温度: ' + data.temperature);
                    if (data.cfg_weight != null) parts.push('CFG: ' + data.cfg_weight);
                    if (data.exaggeration != null) parts.push('夸张: ' + data.exaggeration);
                    if (parts.length) {
                        paramsEl.textContent = parts.join(' | ');
                        paramsRow.style.display = 'block';
                    } else {
                        paramsRow.style.display = 'none';
                    }

                    if (data.error) {
                        document.getElementById('errorPara').style.display = 'block';
                        document.getElementById('errorMsg').textContent = data.error;
                    }

                    loadFiles(data.output_dir);
                    startPolling(data.status === 'processing' || data.status === 'pending');
                })
                .catch(err => {
                    document.getElementById('fileList').innerHTML = '<li class="no-files">加载失败: ' + err.message + '</li>';
                });
        }

        let pollTimer = null;

        function startPolling(shouldPoll) {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            if (shouldPoll) {
                pollTimer = setInterval(pollAndRefresh, 3000);
            }
        }

        function pollAndRefresh() {
            if (!accessCode) return;
            fetch('/srt/status/' + accessCode)
                .then(response => response.json())
                .then(data => {
                    editedSrtFiles = data.edited_srt_files || [];

                    // ── Update language badge ──
                    const langMap = { en: '🇬🇧 英文', zh: '🇨🇳 中文', ja: '🇯🇵 日语', ko: '🇰🇷 韩语', fr: '🇫🇷 法语', es: '🇪🇸 西班牙语', ru: '🇷🇺 俄语', ms: '🇲🇾 马来语', ar: '🇸🇦 阿拉伯语', da: '🇩🇰 丹麦语', de: '🇩🇪 德语', el: '🇬🇷 希腊语', fi: '🇫🇮 芬兰语', he: '🇮🇱 希伯来语', hi: '🇮🇳 印地语', it: '🇮🇹 意大利语', nl: '🇳🇱 荷兰语', no: '🇳🇴 挪威语', pl: '🇵🇱 波兰语', pt: '🇵🇹 葡萄牙语', sv: '🇸🇪 瑞典语', sw: '🇹🇿 斯瓦希里语', tr: '🇹🇷 土耳其语', th: '🇹🇭 泰语', id: '🇮🇩 印尼语' };
                    const langEl = document.getElementById('targetLanguageBadge');
                    if (data.target_language && langMap[data.target_language]) {
                        langEl.textContent = langMap[data.target_language];
                        langEl.style.display = 'inline';
                    } else if (data.target_language) {
                        langEl.textContent = '🌐 ' + data.target_language;
                        langEl.style.display = 'inline';
                    } else {
                        langEl.style.display = 'none';
                    }

                    document.getElementById('status').textContent = statusLabels[data.status] || data.status;
                    document.getElementById('status').className = 'status-badge ' + getStatusClass(data.status);
                    document.getElementById('outputDir').textContent = shortPath(data.output_dir);

                    // ── Display temperature / cfg_weight / exaggeration ──
                    var pe = document.getElementById('paramDisplay');
                    var pr = document.getElementById('paramsRow');
                    var pts = [];
                    if (data.temperature != null) pts.push('温度: ' + data.temperature);
                    if (data.cfg_weight != null) pts.push('CFG: ' + data.cfg_weight);
                    if (data.exaggeration != null) pts.push('夸张: ' + data.exaggeration);
                    if (pts.length) { pe.textContent = pts.join(' | '); pr.style.display = 'block'; }
                    else { pr.style.display = 'none'; }

                    const progressEl = document.getElementById('progressText');
                    if (data.progress) {
                        progressEl.textContent = '— ' + shortPath(data.progress);
                        progressEl.style.display = 'inline';
                    } else {
                        progressEl.textContent = '';
                        progressEl.style.display = 'none';
                    }

                    if (data.error) {
                        document.getElementById('errorPara').style.display = 'block';
                        document.getElementById('errorMsg').textContent = data.error;
                    } else {
                        document.getElementById('errorPara').style.display = 'none';
                    }
                    document.getElementById('resubmitBtn').style.display = (data.status === 'failed' || data.status === 'cancelled') ? 'inline-block' : 'none';

                    loadFiles(data.output_dir);
                    startPolling(data.status === 'processing');
                })
                .catch(err => {
                    console.error('Poll failed:', err);
                });
        }

        function loadFiles(outputDir) {
            if (!outputDir) {
                document.getElementById('fileList').innerHTML = '<li class="no-files">无输出目录</li>';
                return;
            }

            fetch('/files/list?dir=' + encodeURIComponent(outputDir))
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('fileList').innerHTML = '<li class="no-files">加载失败: ' + data.error + '</li>';
                        return;
                    }

                    if (!data.files || data.files.length === 0) {
                        document.getElementById('fileList').innerHTML = '<li class="no-files">没有生成的文件</li>';
                        return;
                    }

                    const filteredFiles = data.files.filter(f => f.name !== 'job.log');
                    if (filteredFiles.length === 0) {
                        document.getElementById('fileList').innerHTML = '<li class="no-files">没有生成的文件</li>';
                        return;
                    }
                    const downloadPath = f => '/files/download?path=' + encodeURIComponent(outputDir + '/' + f.name);
                    const ext = f => f.name.split('.').pop().toLowerCase();
                    const playBtn = f => {
                        if (isEditableSrt(f.name)) return '';
                        const e = ext(f);
                        if (e === 'wav') return `<button onclick="playAudio(this,'${downloadPath(f)}')" class="btn-play">播放</button>`;
                        if (e === 'mp4') return `<button onclick="playVideo('${downloadPath(f)}')" class="btn-play">播放</button>`;
                        return `<span class="btn-placeholder">播放</span>`;
                    };
                    const editBtn = (f) => {
                        if (!isEditableSrt(f.name)) return '';
                        const isEdited = editedSrtFiles.includes(f.name);
                        const label = isEdited ? '重新提交' : '编辑';
                        const cls = isEdited ? 'btn-edit resubmit' : 'btn-edit';
                        const onclick = isEdited
                            ? `resubmitSrtEdit('${outputDir}', '${f.name}')`
                            : `openSrtEditor('${outputDir}', '${f.name}')`;
                        return `<button onclick="${onclick}" class="${cls}">${label}</button>`;
                    };
                    // Check if any SRT files exist — if so non-SRT files get 4-column grid
                    const hasSrt = filteredFiles.some(f => isEditableSrt(f.name));
                    // SRT files use the same 4-column grid so all buttons have matching widths
                    const actionsClass = f => isEditableSrt(f.name) || hasSrt ? 'file-actions editable' : 'file-actions';
                    document.getElementById('fileList').innerHTML = filteredFiles.map(file => `
                        <li>
                            <div class="file-info">
                                <span class="file-name">${file.name}</span>
                                <span class="file-size">${formatBytes(file.size)}</span>
                            </div>
                            <div class="${actionsClass(file)}">
                                ${playBtn(file)}
                                ${editBtn(file)}
                                <button onclick="downloadFile('${downloadPath(file)}', '${file.name}')" class="btn-download">下载</button>
                                <button onclick="deleteFile('${outputDir}', '${file.name}')" class="btn-delete">删除</button>
                            </div>
                        </li>
                    `).join('');
                })
                .catch(err => {
                    document.getElementById('fileList').innerHTML = '<li class="no-files">加载失败: ' + err.message + '</li>';
                });
        }

        function resubmitJob() {
            if (!accessCode) return;
            if (!confirm('确定要重新提交此任务吗？')) return;
            fetch('/srt/resubmit/' + accessCode, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert('重新提交失败: ' + (data.error || '未知错误'));
                    }
                })
                .catch(err => alert('重新提交失败: ' + err.message));
        }

        function refreshFiles() {
            if (!accessCode) return;
            fetch('/srt/status/' + accessCode)
                .then(response => response.json())
                .then(data => {
                    editedSrtFiles = data.edited_srt_files || [];
                    document.getElementById('status').textContent = statusLabels[data.status] || data.status;
                    document.getElementById('status').className = 'status-badge ' + getStatusClass(data.status);
                    document.getElementById('outputDir').textContent = shortPath(data.output_dir);

                    // ── Display temperature / cfg_weight / exaggeration ──
                    var pe = document.getElementById('paramDisplay');
                    var pr = document.getElementById('paramsRow');
                    var pts = [];
                    if (data.temperature != null) pts.push('温度: ' + data.temperature);
                    if (data.cfg_weight != null) pts.push('CFG: ' + data.cfg_weight);
                    if (data.exaggeration != null) pts.push('夸张: ' + data.exaggeration);
                    if (pts.length) { pe.textContent = pts.join(' | '); pr.style.display = 'block'; }
                    else { pr.style.display = 'none'; }

                    const progressEl = document.getElementById('progressText');
                    if (data.progress) {
                        progressEl.textContent = '— ' + shortPath(data.progress);
                        progressEl.style.display = 'inline';
                    } else {
                        progressEl.textContent = '';
                        progressEl.style.display = 'none';
                    }

                    if (data.error) {
                        document.getElementById('errorPara').style.display = 'block';
                        document.getElementById('errorMsg').textContent = data.error;
                    } else {
                        document.getElementById('errorPara').style.display = 'none';
                    }
                    document.getElementById('resubmitBtn').style.display = (data.status === 'failed' || data.status === 'cancelled') ? 'inline-block' : 'none';
                    loadFiles(data.output_dir);
                    startPolling(data.status === 'processing');
                })
                .catch(err => {
                    console.error('Refresh failed:', err);
                    document.getElementById('fileList').innerHTML = '<li class="no-files">刷新失败: ' + err.message + '</li>';
                });
        }

        function playAudio(btn, downloadUrl) {
            const existing = document.querySelector('.file-audio[data-src="' + downloadUrl + '"]');
            if (existing) { existing.remove(); return; }
            const audio = document.createElement('audio');
            audio.className = 'file-audio';
            audio.setAttribute('data-src', downloadUrl);
            audio.controls = true;
            audio.src = downloadUrl;
            btn.closest('li').insertAdjacentElement('afterend', audio);
            audio.play();
        }

        function playVideo(downloadUrl) {
            document.getElementById('modalVideo').src = downloadUrl;
            document.getElementById('videoModal').classList.add('active');
        }

        function closeVideo() {
            const modal = document.getElementById('videoModal');
            modal.classList.remove('active');
            document.getElementById('modalVideo').pause();
            document.getElementById('modalVideo').src = '';
        }

        function deleteFile(outputDir, filename) {
            if (!confirm('确定要删除文件 ' + filename + ' 吗？')) return;

            fetchWithCsrf('/files/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: outputDir + '/' + filename, access_code: accessCode })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadFiles(outputDir);
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(err => alert('删除失败: ' + err.message));
        }

        // ── SRT Editor functions ─────────────────────────

        let _editingFilePath = null;

        function openSrtEditor(outputDir, filename) {
            const filePath = outputDir + '/' + filename;
            _editingFilePath = filePath;

            // Read file content
            fetch('/files/read?path=' + encodeURIComponent(filePath))
                .then(response => {
                    if (!response.ok) return response.json().then(d => { throw new Error(d.error || '读取失败'); });
                    return response.text();
                })
                .then(content => {
                    document.getElementById('editorFileName').textContent = filename;
                    document.getElementById('editorTextarea').value = content;
                    document.getElementById('editorStatus').textContent = '';
                    document.getElementById('editorStatus').className = 'editor-status';
                    document.getElementById('srtEditorOverlay').classList.add('active');
                    // Focus and move cursor to end
                    const ta = document.getElementById('editorTextarea');
                    ta.focus();
                    ta.setSelectionRange(ta.value.length, ta.value.length);
                })
                .catch(err => {
                    alert('读取文件失败: ' + err.message);
                });
        }

        function closeSrtEditor() {
            document.getElementById('srtEditorOverlay').classList.remove('active');
            _editingFilePath = null;
        }

        function saveSrtEdit() {
            const content = document.getElementById('editorTextarea').value;
            const statusEl = document.getElementById('editorStatus');
            const saveBtn = document.getElementById('editorSaveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            statusEl.textContent = '';
            statusEl.className = 'editor-status';

            fetchWithCsrf('/files/save-srt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    path: _editingFilePath,
                    content: content,
                    access_code: accessCode
                })
            })
            .then(async response => {
                const text = await response.text();
                let data;
                try { data = JSON.parse(text); } catch (e) { data = null; }
                if (!response.ok || !data) {
                    throw new Error(data?.error || `服务器返回错误 (${response.status})`);
                }
                return data;
            })
            .then(data => {
                if (data.success) {
                    statusEl.textContent = '✅ 保存成功！下游步骤已标记为重新运行。点击"重新提交"以继续。';
                    statusEl.className = 'editor-status success';
                    const filename = _editingFilePath.split('/').pop();
                    editedSrtFiles.push(filename);
                    // After save, close editor and reload files to show "重新提交" button
                    setTimeout(() => {
                        closeSrtEditor();
                        if (accessCode) {
                            fetch('/srt/status/' + accessCode)
                                .then(r => r.json())
                                .then(d => loadFiles(d.output_dir));
                        }
                    }, 1500);
                } else {
                    statusEl.textContent = '❌ 保存失败: ' + (data.error || '未知错误');
                    statusEl.className = 'editor-status error';
                }
            })
            .catch(err => {
                statusEl.textContent = '❌ 保存失败: ' + err.message;
                statusEl.className = 'editor-status error';
            })
            .finally(() => {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存';
            });
        }

        function resubmitSrtEdit(outputDir, filename) {
            if (!accessCode) return;
            if (!confirm('确定要使用编辑后的文件重新运行任务吗？后续步骤将会重新执行。')) return;

            fetchWithCsrf('/files/srt-resubmit/' + accessCode, { method: 'POST' })
                .then(async response => {
                    const text = await response.text();
                    let data;
                    try { data = JSON.parse(text); } catch (e) { data = null; }
                    if (!response.ok || !data) {
                        throw new Error(data?.error || `服务器返回错误 (${response.status})`);
                    }
                    return data;
                })
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert('重新提交失败: ' + (data.error || '未知错误'));
                    }
                })
                .catch(err => alert('重新提交失败: ' + err.message));
        }

        // ── Keyboard shortcut: Ctrl+Enter or Cmd+Enter to save ──
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const overlay = document.getElementById('srtEditorOverlay');
                if (overlay.classList.contains('active')) {
                    e.preventDefault();
                    saveSrtEdit();
                }
            }
            // Escape to close editor
            if (e.key === 'Escape') {
                const overlay = document.getElementById('srtEditorOverlay');
                if (overlay.classList.contains('active')) {
                    closeSrtEditor();
                }
            }
        });


        loadJobStatus();
    </script>
    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
</body>
</html>
