<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克隆宁师语音</title>
    <link rel="stylesheet" href="/ning.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">任务已提交，正在处理...</div>
        </div>
    </div>

    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>

    <div class="container">
        <h1>克隆宁师语音</h1>
    <form id="ttsForm">
        <div class="form-row">
            <label for="target_language">目标语言</label>
            <div id="langSelectContainer"></div>
        </div>

        <div class="form-row">
            <label for="inputMode">输入方式</label>
            <select id="inputMode" name="inputMode">
                <option value="text">输入文字</option>
                <option value="file">上传文件</option>
            </select>
        </div>

        <div id="textInputSection">
            <label for="text" id="textLabel">English文字 <span id="charCount" style="font-weight:normal;color:#999;font-size:0.85em;">0/500</span></label>
            <textarea id="text" name="text" required maxlength="500" placeholder="Enter the text you want to convert to speech..." style="width:100%;height:120px;padding:10px;margin-bottom:16px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;" oninput="document.getElementById('charCount').textContent=this.value.length+'/500'"></textarea>
        </div>

        <div id="fileInputSection" class="hidden">
            <div class="form-row">
                <label for="file">上传文本文件</label>
                <input type="file" id="file" name="file" accept=".txt">
            </div>
            <div class="info-text">文件内容将按 <code>&lt;数字&gt;</code> 标记分段，每段生成语音后以指定秒数的静音拼接。例如：<code>&lt;2&gt;第一段&lt;3&gt;第二段</code></div>
        </div>

        <div class="form-row">
            <label for="filename">输出语音文件名</label>
            <input type="text" id="filename" name="filename" value="output.wav" placeholder="output.wav">
        </div>

        <div id="floatSliders"></div>

        <button type="submit">产生语音！</button>
    </form>

    <div id="resultSection"></div>

    <div id="audioSection">
        <label>生成的语音：</label>
        <audio id="audioPlayer" controls></audio>
        <button type="button" class="btn-secondary" id="downloadBtn">保存到文件</button>
    </div>
    </div>

    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script>
document.getElementById('inputMode').addEventListener('change', function(e) {
    var textSection = document.getElementById('textInputSection');
    var fileSection = document.getElementById('fileInputSection');
    var textInput = document.getElementById('text');
    var fileInput = document.getElementById('file');

    if (e.target.value === 'text') {
        textSection.classList.remove('hidden');
        fileSection.classList.add('hidden');
        textInput.setAttribute('required', '');
        textInput.removeAttribute('disabled');
        fileInput.removeAttribute('required');
    } else {
        textSection.classList.add('hidden');
        fileSection.classList.remove('hidden');
        textInput.removeAttribute('required');
        textInput.setAttribute('disabled', '');
        fileInput.setAttribute('required', '');
    }
});

var langSelect = initLanguageSelect('langSelectContainer');
initResultSection('resultSection', 'checkLink');

langSelect.addEventListener('change', function() {
    var lang = getLangName(this.value);
    document.getElementById('textLabel').innerHTML = lang + '文字 <span id="charCount" style="font-weight:normal;color:#999;font-size:0.85em;">0/500</span>';
});

document.getElementById('ttsForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var inputMode = document.getElementById('inputMode').value;

    if (inputMode === 'text') {
        var text = document.getElementById('text').value;
        if (!text) { alert('请输入文字内容'); return; }
        submitJob('/tts/process', {
            text: text,
            filename: document.getElementById('filename').value || 'output.wav',
            temperature: document.getElementById('temperature').value,
            target_language: document.getElementById('target_language').value,
            cfg_weight: document.getElementById('cfg_weight').value,
            exaggeration: document.getElementById('exaggeration').value,
        }, 'checkLink', '/tts');
    } else {
        var fileInput = document.getElementById('file');
        if (!fileInput.files || !fileInput.files[0]) {
            alert('请选择要上传的文件'); return;
        }
        var fd = new FormData();
        fd.append('file', fileInput.files[0]);
        fd.append('temperature', document.getElementById('temperature').value);
        fd.append('target_language', document.getElementById('target_language').value);
        fd.append('cfg_weight', document.getElementById('cfg_weight').value);
        fd.append('exaggeration', document.getElementById('exaggeration').value);
        fd.append('filename', document.getElementById('filename').value || 'output.wav');
        submitJob('/audio/process', fd, 'checkLink', '/tts');
    }

    document.getElementById('downloadBtn').onclick = function() {
        window.location.href = '/result?code=' + document.getElementById('accessCode').textContent;
    };
});
    </script>
</body>
</html>
