<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>从视频提取字幕</title>
    <link rel="stylesheet" href="/ning.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">任务已提交，正在处理...</div>
        </div>
    </div>

    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>

    <div class="container">
        <h1>从视频提取字幕</h1>
        <form id="ocrForm">
            <div class="form-row">
                <label for="videoFile">选择视频文件</label>
                <input type="file" id="videoFile" name="videoFile" accept=".mp4,.avi,.mov,.mkv,.webm" required>
            </div>
            <button type="submit">开始 OCR 提取字幕！</button>
        </form>

        <div id="resultSection"></div>
    </div>

    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script>
var isAuthenticated = false;
fetch('/auth/me').then(function(r) { return r.json(); }).then(function(data) {
    isAuthenticated = data.authenticated;
    if (!isAuthenticated) {
        window.location.href = '/auth/login?next=' + encodeURIComponent('/video/ocr');
    }
});

initResultSection('resultSection', 'checkLink');

document.getElementById('ocrForm').addEventListener('submit', function(e) {
    e.preventDefault();

    if (!isAuthenticated) {
        window.location.href = '/auth/login?next=' + encodeURIComponent('/video/ocr');
        return;
    }

    var fileInput = document.getElementById('videoFile');
    if (!fileInput.files || !fileInput.files[0]) {
        alert('请选择视频文件');
        return;
    }

    var formData = new FormData();
    formData.append('video_file', fileInput.files[0]);

    submitJob('/video/ocr/process', formData, 'checkLink', '/video/ocr');
});
    </script>
</body>
</html>
