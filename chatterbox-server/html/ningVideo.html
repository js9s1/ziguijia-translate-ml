<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译官方宁视频</title>
    <link rel="stylesheet" href="/ning.css">

</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">处理中，请稍候...</div>
        </div>
    </div>
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>
    <div class="container">
        <h1>翻译官方宁视频</h1>
        <form id="videoForm">
            <div class="form-row">
                <label for="target_language">目标语言</label>
                <div id="langSelectContainer"></div>
            </div>

            <div class="form-row">
                <label for="number">视频号</label>
                <input type="text" id="number" name="number" required placeholder="输入视频号">
            </div>

            <div class="form-row">
                <label for="mode">翻译模式</label>
                <select id="mode" name="mode">
                    <option value="srt">上传SRT字幕</option>
                    <option value="ocr">OCR识别翻译（RapidVideOCR + HY-MT）</option>
                    <option value="ocr-translate-only">OCR识别并生成翻译字幕（不生成音频/视频）</option>
                </select>
            </div>

            <div class="form-row" id="srtSection">
                <label for="srt_file">上传SRT字幕文件</label>
                <input type="file" id="srt_file" name="srt_file" accept=".srt" required>
            </div>


            <div class="form-row" id="trimSection" style="display:none;align-items:stretch;">
                <label style="font-weight:bold;color:#e2b714;white-space:;align-self:left;">裁剪设置（OCR模式）</label>
                <div style="display:flex;flex-direction:column;gap:4px;flex:1;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <label for="start_trim">开头裁剪 (秒)</label>
                        <input type="number" id="start_trim" name="start_trim" min="0" step="0.01" value="12.25" style="width:120px;padding:6px;border:1px solid #555;border-radius:4px;background:#1e1e1e;color:#e0e0e0;">
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <label for="end_trim">结尾裁剪 (秒)</label>
                        <input type="number" id="end_trim" name="end_trim" min="0" step="0.01" value="40.0" style="width:120px;padding:6px;border:1px solid #555;border-radius:4px;background:#1e1e1e;color:#e0e0e0;">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <label for="blur">模糊处理</label>
                <select id="blur" name="blur">
                    <option value="yes">是</option>
                    <option value="no">否</option>
                </select>
            </div>

            <div id="floatSliders"></div>
            <button type="submit">开始处理！</button>
        </form>
        <div id="resultSection"></div>
    </div>
    <script src="/utils.js"></script>
    <script>
        document.getElementById('mode').addEventListener('change', function() {
            var srtSection = document.getElementById('srtSection');
            var trimSection = document.getElementById('trimSection');
            if (this.value === 'ocr') {
                srtSection.classList.add('hidden');
                document.getElementById('srt_file').removeAttribute('required');
                trimSection.style.display = '';
            } else if (this.value === 'ocr-translate-only') {
                srtSection.classList.add('hidden');
                document.getElementById('srt_file').removeAttribute('required');
                trimSection.style.display = '';
            } else {
                srtSection.classList.remove('hidden');
                document.getElementById('srt_file').setAttribute('required', '');
                trimSection.style.display = 'none';
            }
        });

        initFloatSliders('floatSliders');
        initLanguageSelect('langSelectContainer');
        initResultSection('resultSection', 'checkProgressLink');

        function showCachedPrompt(data) {
            var overlay = document.getElementById('loadingOverlay');
            // Create a modal dialog
            var dialog = document.createElement('div');
            dialog.id = 'cachedDialog';
            dialog.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;';
            var box = document.createElement('div');
            box.style.cssText = 'background:#1e1e1e;border:1px solid #555;border-radius:12px;padding:24px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.5);';

            var msg = document.createElement('p');
            msg.style.cssText = 'color:#e0e0e0;font-size:1.05em;line-height:1.6;margin-bottom:20px;white-space:pre-line;';
            msg.textContent = data.message || '已找到缓存的视频文件，是否使用该已下载的版本？';

            var btnRow = document.createElement('div');
            btnRow.style.cssText = 'display:flex;gap:12px;justify-content:flex-end;';

            var btnDownload = document.createElement('button');
            btnDownload.textContent = '重新下载';
            btnDownload.style.cssText = 'padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:0.95em;background:#555;color:#e0e0e0;';
            btnDownload.onclick = function() {
                document.body.removeChild(dialog);
                overlay.classList.add('active');
                var fd = new FormData(document.getElementById('videoForm'));
                fd.set('no_cache_check', 'true');
                fetch('/video/ning/ocr-process', { method: 'POST', body: fd })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    overlay.classList.remove('active');
                    if (d.error) { alert('错误: ' + d.error); return; }
                    showResult(d.access_code, '/result?code=' + d.access_code, 'checkProgressLink');
                })
                .catch(function(err) { overlay.classList.remove('active'); alert('错误: ' + err.message); });
            };

            var btnUse = document.createElement('button');
            btnUse.textContent = '使用缓存';
            btnUse.style.cssText = 'padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:0.95em;background:#e2b714;color:#1e1e1e;font-weight:bold;';
            btnUse.onclick = function() {
                document.body.removeChild(dialog);
                overlay.classList.add('active');
                var fd = new FormData(document.getElementById('videoForm'));
                fd.set('cached_path', data.paths[0]);
                fetch('/video/ning/ocr-process', { method: 'POST', body: fd })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    overlay.classList.remove('active');
                    if (d.error) { alert('错误: ' + d.error); return; }
                    showResult(d.access_code, '/result?code=' + d.access_code, 'checkProgressLink');
                })
                .catch(function(err) { overlay.classList.remove('active'); alert('错误: ' + err.message); });
            };

            btnRow.appendChild(btnDownload);
            btnRow.appendChild(btnUse);
            box.appendChild(msg);
            box.appendChild(btnRow);
            dialog.appendChild(box);
            document.body.appendChild(dialog);
        }

        document.getElementById('videoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Remove any lingering cached dialog
            var oldDialog = document.getElementById('cachedDialog');
            if (oldDialog) document.body.removeChild(oldDialog);

            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');
            const formData = new FormData();
            formData.append('number', document.getElementById('number').value);
            formData.append('temperature', document.getElementById('temperature').value);
            formData.append('blur', document.getElementById('blur').value);
            formData.append('target_language', document.getElementById('target_language').value);
            formData.append('cfg_weight', document.getElementById('cfg_weight').value);
            formData.append('exaggeration', document.getElementById('exaggeration').value);

            var mode = document.getElementById('mode').value;
            if (mode === 'ocr') {
                var startTrim = parseFloat(document.getElementById('start_trim').value);
                var endTrim = parseFloat(document.getElementById('end_trim').value);
                if (isNaN(startTrim) || startTrim < 0) { alert('请填写有效的开头裁剪秒数（≥0）'); overlay.classList.remove('active'); return; }
                if (isNaN(endTrim) || endTrim < 0) { alert('请填写有效的结尾裁剪秒数（≥0）'); overlay.classList.remove('active'); return; }
                formData.append('start_trim', startTrim);
                formData.append('end_trim', endTrim);
            }
            var url;
            if (mode === 'ocr') {
                formData.append('ocr_mode', 'full');
                url = '/video/ning/ocr-process';
            } else if (mode === 'ocr-translate-only') {
                formData.append('ocr_mode', 'translate-only');
                url = '/video/ning/ocr-process';
            } else {
                formData.append('srt_file', document.getElementById('srt_file').files[0]);
                url = '/video/ning/process';
            }

            fetch(url, { method: 'POST', body: formData })
            .then(function(response) {
                if (response.status === 401) {
                    overlay.classList.remove('active');
                    alert('请先登录');
                    window.location.href = '/auth/login?next=' + encodeURIComponent('/video/ning');
                    return;
                }
                return response.json();
            })
            .then(function(data) {
                if (!data) return;
                overlay.classList.remove('active');
                if (data.error) { alert('错误: ' + data.error); return; }

                // Check if we found a cached video — prompt user
                if (data.cached_found) {
                    showCachedPrompt(data);
                    return;
                }

                showResult(data.access_code, '/result?code=' + data.access_code, 'checkProgressLink');
            })
            .catch(function(err) { overlay.classList.remove('active'); alert('错误: ' + err.message); });
        });
    </script>
    <script src="/auth.js"></script>
</body>
</html>
