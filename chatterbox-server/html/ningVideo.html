<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译官方宁视频</title>
    <link rel="stylesheet" href="/ning.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">处理中，请稍候...</div>
        </div>
    </div>
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>
    <div class="container">
        <h1>翻译官方宁视频</h1>
        <form id="videoForm">
            <div class="form-row">
                <label for="target_language">目标语言</label>
                <div id="langSelectContainer"></div>
            </div>

            <div class="form-row">
                <label for="number">视频号</label>
                <input type="text" id="number" name="number" required placeholder="输入视频号">
            </div>

            <div class="form-row">
                <label for="mode">翻译模式</label>
                <select id="mode" name="mode"></select>
            </div>

            <div class="form-row hidden" id="ocrOnlyRow">
                <label>仅OCR提取字幕（不翻译）</label>
                <div style="display:flex;gap:8px;align-items:center;padding-top:4px;">
                    <span><input type="radio" name="ocr_only" value="yes" checked> 是</span>
                    <span><input type="radio" name="ocr_only" value="no"> 否</span>
                </div>
            </div>

            <div class="form-row" id="srtSection">
                <label for="srt_file">上传SRT字幕文件</label>
                <input type="file" id="srt_file" name="srt_file" accept=".srt" required>
            </div>

            <div class="form-row" id="blurRow">
                <label>模糊处理</label>
                <div style="display:flex;gap:8px;align-items:center;padding-top:4px;">
                    <span><input type="radio" name="blur" value="yes" checked> 是</span>
                    <span><input type="radio" name="blur" value="no"> 否</span>
                </div>
            </div>

            <div id="floatSliders"></div>
            <button type="submit">开始处理！</button>
        </form>
        <div id="resultSection"></div>
    </div>
    <script src="/utils.js"></script>
    <script src="/util_video.js"></script>
    <script>
        var _submitUrl = '';

        initVideoForm({
            pageType: 'ning',
            onSubmit: function(e) {
                e.preventDefault();
                var oldDialog = document.getElementById('cachedDialog');
                if (oldDialog) document.body.removeChild(oldDialog);

                var overlay = document.getElementById('loadingOverlay');
                overlay.classList.add('active');
                var formData = collectCommonVideoFields();
                formData.append('number', document.getElementById('number').value);
                var blurEl = document.querySelector('input[name="blur"]:checked');
                formData.append('blur', blurEl ? blurEl.value : 'yes');

                var mode = document.getElementById('mode').value;
                if (mode === 'srt') {
                    formData.append('srt_file', document.getElementById('srt_file').files[0]);
                    _submitUrl = '/video/ning/process';
                } else if (mode === 'auto') {
                    _submitUrl = '/video/ning/auto-process';
                } else {
                    formData.append('ocr_mode', mode === 'ocr-translate-only' ? 'translate-only' : 'full');
                    if (mode === 'ocr-translate-only') {
                        formData.append('ocr_only', getOcrOnlyValue());
                    }
                    _submitUrl = '/video/ning/ocr-process';
                }

                submitJob(_submitUrl, formData, 'checkProgressLink', '/video/ning');
            }
        });

        function showCachedPrompt(data) {
            var overlay = document.getElementById('loadingOverlay');
            var dialog = document.createElement('div');
            dialog.id = 'cachedDialog';
            dialog.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;';
            var box = document.createElement('div');
            box.style.cssText = 'background:#1e1e1e;border:1px solid #555;border-radius:12px;padding:24px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.5);';

            var msg = document.createElement('p');
            msg.style.cssText = 'color:#e0e0e0;font-size:1.05em;line-height:1.6;margin-bottom:20px;white-space:pre-line;';
            msg.textContent = data.message || '已找到缓存的视频文件，是否使用该已下载的版本？';

            var btnRow = document.createElement('div');
            btnRow.style.cssText = 'display:flex;gap:12px;justify-content:flex-end;';

            var cachedMode = document.getElementById('mode').value;

            function doResubmit(extraParams) {
                var fd = new FormData(document.getElementById('videoForm'));
                for (var k in extraParams) { fd.set(k, extraParams[k]); }
                if (cachedMode === 'ocr' || cachedMode === 'ocr-translate-only') {
                    fd.set('ocr_mode', cachedMode === 'ocr-translate-only' ? 'translate-only' : 'full');
                }
                if (cachedMode === 'ocr-translate-only') {
                    fd.set('ocr_only', getOcrOnlyValue());
                }
                overlay.classList.add('active');
                fetchWithCsrf(_submitUrl, {
                    method: 'POST',
                    body: fd,
                    headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(function(r) { return handleApiResponse(r, '/video/ning'); })
                .then(function(d) {
                    overlay.classList.remove('active');
                    if (!d) return;
                    if (showApiError(d)) return;
                    showResult(d.access_code, '/result?code=' + d.access_code, 'checkProgressLink');
                })
                .catch(function(err) { overlay.classList.remove('active'); alert('错误: ' + err.message); });
            }

            var btnDownload = document.createElement('button');
            btnDownload.textContent = '重新下载';
            btnDownload.style.cssText = 'padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:0.95em;background:#555;color:#e0e0e0;';
            btnDownload.onclick = function() {
                document.body.removeChild(dialog);
                doResubmit({ 'no_cache_check': 'true' });
            };

            var btnUse = document.createElement('button');
            btnUse.textContent = '使用缓存';
            btnUse.style.cssText = 'padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:0.95em;background:#e2b714;color:#1e1e1e;font-weight:bold;';
            btnUse.onclick = function() {
                document.body.removeChild(dialog);
                doResubmit({ 'cached_path': data.paths[0] });
            };

            btnRow.appendChild(btnDownload);
            btnRow.appendChild(btnUse);
            box.appendChild(msg);
            box.appendChild(btnRow);
            dialog.appendChild(box);
            document.body.appendChild(dialog);
        }
    </script>
    <script src="/auth.js"></script>
</body>
</html>
