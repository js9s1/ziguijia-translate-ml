<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>从SRT生成音轨</title>
    <link rel="stylesheet" href="/ning.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">处理中，请稍候...</div>
        </div>
    </div>

    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>

    <div class="container">
        <h1>从SRT生成音轨</h1>
    <form action="/srt/process" method="POST" id="srtForm" enctype="multipart/form-data">
        <div class="form-row">
            <label for="target_language">目标语言</label>
            <div id="langSelectContainer"></div>
        </div>
        <div class="form-row">
            <label for="srt_file">上传SRT字幕文件</label>
            <input type="file" id="srt_file" name="srt_file" accept=".srt" required>
        </div>


        <div id="floatSliders"></div>

        <button type="submit">开始处理！</button>
    </form>

<div id="resultSection"></div>
    </div>

    <script src="/utils.js"></script>
    <script>
        initFloatSliders('floatSliders');
        initLanguageSelect('langSelectContainer');
        initResultSection('resultSection', 'checkProgressLink');

        document.getElementById('srtForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');

            const formData = new FormData(this);

            fetch('/srt/process', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                if (response.status === 401) {
                    overlay.classList.remove('active');
                    alert('请先登录');
                    window.location.href = '/auth/login?next=' + encodeURIComponent('/srt');
                    return;
                }
                return response.json();
            })
            .then(function(data) {
                if (!data) return;
                overlay.classList.remove('active');
                if (data.error) {
                    alert('错误: ' + data.error);
                    return;
                }
                showResult(data.access_code, '/result?code=' + data.access_code, 'checkProgressLink');
            })
            .catch(err => {
                overlay.classList.remove('active');
                alert('错误: ' + err.message);
            });
        });
    </script>
    <script src="/auth.js"></script>
</body>
</html>
