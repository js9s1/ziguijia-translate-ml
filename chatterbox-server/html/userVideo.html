<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译自定义视频</title>
    <link rel="stylesheet" href="/ning.css">
    <style>
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">处理中，请稍候...</div>
        </div>
    </div>
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>
    <div class="container">
        <h1>翻译自定义视频</h1>
        <form id="videoForm">
            <div class="form-row">
                <label for="target_language">目标语言</label>
                <div id="langSelectContainer"></div>
            </div>

            <div class="form-row">
                <label for="video_file">上传视频文件</label>
                <input type="file" id="video_file" name="video_file" accept="video/*" required>
            </div>

            <div class="form-row">
                <label for="mode">翻译模式</label>
                <select id="mode" name="mode"></select>
            </div>

            <div class="form-row hidden" id="ocrOnlyRow">
                <label>仅OCR提取字幕（不翻译）</label>
                <div style="display:flex;gap:8px;align-items:center;padding-top:4px;">
                    <span><input type="radio" name="ocr_only" value="yes" checked> 是</span>
                    <span><input type="radio" name="ocr_only" value="no"> 否</span>
                </div>
            </div>

            <div class="form-row" id="srtSection">
                <label for="srt_file">上传SRT字幕文件</label>
                <input type="file" id="srt_file" name="srt_file" accept=".srt">
            </div>

            <div id="floatSliders"></div>

            <button type="submit">开始处理！</button>
        </form>
        <div id="resultSection"></div>
    </div>
    <script src="/utils.js"></script>
    <script src="/util_video.js"></script>
    <script>
        initVideoForm({
            pageType: 'custom',
            onSubmit: function(e) {
                e.preventDefault();
                var formData = collectCommonVideoFields();
                formData.append('video_file', document.getElementById('video_file').files[0]);

                var mode = document.getElementById('mode').value;
                var url;
                if (mode === 'srt') {
                    formData.append('srt_file', document.getElementById('srt_file').files[0]);
                    url = '/video/custom/process';
                } else if (mode === 'auto') {
                    url = '/video/custom/auto-process';
                } else {
                    formData.append('ocr_mode', mode === 'ocr-translate-only' ? 'translate-only' : 'full');
                    if (mode === 'ocr-translate-only') {
                        formData.append('ocr_only', getOcrOnlyValue());
                    }
                    url = '/video/custom/ocr-process';
                }

                submitJob(url, formData, 'checkProgressLink', '/video/custom');
            }
        });
    </script>
    <script src="/auth.js"></script>
</body>
</html>
