<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译自定义视频</title>
    <link rel="stylesheet" href="/ning.css">
    <style>
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="hourglass">&#8987;</div>
            <div class="loading-text">处理中，请稍候...</div>
        </div>
    </div>
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>
    <div class="container">
        <h1>翻译自定义视频</h1>
        <form id="videoForm">
            <div class="form-row">
                <label for="target_language">目标语言</label>
                <div id="langSelectContainer"></div>
            </div>

            <div class="form-row">
                <label for="mode">翻译模式</label>
                <select id="mode" name="mode">
                    <option value="srt">上传SRT字幕</option>
                    <option value="auto">语音识别翻译（Whisper + HY-MT）</option>
                    <option value="ocr">OCR识别翻译（RapidVideOCR + HY-MT）</option>
                </select>
            </div>

            <div class="form-row">
                <label for="video_file">上传视频文件</label>
                <input type="file" id="video_file" name="video_file" accept="video/*" required>
            </div>

            <div class="form-row" id="srtSection">
                <label for="srt_file">上传SRT字幕文件</label>
                <input type="file" id="srt_file" name="srt_file" accept=".srt">
            </div>

            <div id="floatSliders"></div>

            <button type="submit">开始处理！</button>
        </form>
        <div id="resultSection"></div>
    </div>
    <script src="/utils.js"></script>
    <script>
        document.getElementById('mode').addEventListener('change', function() {
            var srtSection = document.getElementById('srtSection');
            if (this.value === 'auto' || this.value === 'ocr') {
                srtSection.classList.add('hidden');
                document.getElementById('srt_file').removeAttribute('required');
            } else {
                srtSection.classList.remove('hidden');
                document.getElementById('srt_file').setAttribute('required', '');
            }
        });

        initFloatSliders('floatSliders');
        initLanguageSelect('langSelectContainer');
        initResultSection('resultSection', 'checkProgressLink');

        document.getElementById('videoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');
            var formData = new FormData();
            formData.append('video_file', document.getElementById('video_file').files[0]);
            formData.append('mode', document.getElementById('mode').value);
            formData.append('temperature', document.getElementById('temperature').value);
            formData.append('target_language', document.getElementById('target_language').value);
            formData.append('cfg_weight', document.getElementById('cfg_weight').value);
            formData.append('exaggeration', document.getElementById('exaggeration').value);

            if (document.getElementById('mode').value === 'srt') {
                formData.append('srt_file', document.getElementById('srt_file').files[0]);
            }

            var mode = document.getElementById('mode').value;
            var url;
            if (mode === 'auto') {
                url = '/video/custom/auto-process';
            } else if (mode === 'ocr') {
                url = '/video/custom/ocr-process';
            } else {
                url = '/video/custom/process';
            }

            fetch(url, { method: 'POST', body: formData })
            .then(function(response) {
                if (response.status === 401) {
                    overlay.classList.remove('active');
                    alert('请先登录');
                    window.location.href = '/auth/login?next=' + encodeURIComponent('/video/custom');
                    return;
                }
                return response.json();
            })
            .then(function(data) {
                if (!data) return;
                overlay.classList.remove('active');
                if (data.error) { alert('错误: ' + data.error); return; }
                showResult(data.access_code, '/result?code=' + data.access_code, 'checkProgressLink');
            })
            .catch(function(err) { overlay.classList.remove('active'); alert('错误: ' + err.message); });
        });
    </script>
    <script src="/auth.js"></script>
</body>
</html>
