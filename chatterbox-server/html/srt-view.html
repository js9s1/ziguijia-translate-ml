<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 查看</title>
    <link rel="stylesheet" href="/ning.css">
    <style>
        pre { background: var(--color-bg-white); padding: 16px; border: 1px solid var(--color-border); border-radius: 4px; overflow-x: auto; font-size: 0.95em; line-height: 1.6; color: var(--color-text-dark); white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="/" class="back-link">← 返回首页</a>
        <div id="userArea" style="font-size:0.9em;"></div>
    </div>
    <div class="container">
        <h1 id="filename"></h1>
        <div id="query"><a id="backToList" href="#">← 返回列表</a></div>
        <div id="loading" style="padding:40px;text-align:center;color:var(--color-text-hint);">加载中...</div>
        <pre id="content" style="display:none;"></pre>
    </div>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('path');
        var fname = path ? path.split('/').pop() : 'Unknown';
        var listUrl = params.get('list') || '/srt-zh.html';
        if (!params.get('list')) {
            if (fname.toLowerCase().endsWith('.zh+en.srt')) {
                listUrl = '/srt-zh+en.html';
            } else if (fname.toLowerCase().endsWith('.en.srt')) {
                listUrl = '/srt-en.html';
            }
        }
        document.getElementById('filename').textContent = fname;
        document.getElementById('backToList').href = listUrl;
        fetch('/files/read?path=' + encodeURIComponent(path))
            .then(function(r) { return r.text(); })
            .then(function(text) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('content').textContent = text;
            })
            .catch(function() {
                document.getElementById('loading').textContent = '加载失败';
            });
    })();
    </script>
    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
</body>
</html>
